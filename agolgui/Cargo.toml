[package]
name = "agolgui"
version = "0.1.0"
edition = "2024"
description = "Cross-platform desktop GUI for exploring ArcGIS Online content and references"
license = "GPL-3.0-or-later"

[dependencies]
agol = { path = "../../agol" }
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures = "0.3.32"
reqwest = { version = "0.13.1", features = ["form", "json", "query"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync"] }
webbrowser = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.8.2"

[profile.release]
lto = "thin"
strip = true
